name: Build Floorpy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 package
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Run regression tests
        run: python -B -m unittest discover -s tests -v

      - name: Download Floorp and build package
        shell: cmd
        run: call .\Build.bat --update

      - name: Verify packaged archive
        shell: cmd
        run: .\7za64.exe t .\floorpy.exe

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath floorpy.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  floorpy.exe" | Set-Content -LiteralPath floorpy.exe.sha256 -Encoding ascii

      - name: Upload portable browser
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floorpy-windows-x64
          path: |
            floorpy.exe
            floorpy.exe.sha256
            readme.md
            LICENSE.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
