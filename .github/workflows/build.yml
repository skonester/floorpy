name: Build Floorpy

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'releases' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check latest Floorp release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      publish: ${{ steps.release.outputs.publish }}
      floorp_tag: ${{ steps.release.outputs.floorp_tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      installer_url: ${{ steps.release.outputs.installer_url }}
      installer_sha256: ${{ steps.release.outputs.installer_sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare upstream version with published Floorpy releases
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLOORPY_PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: python3 scripts/floorp_release.py plan

  build:
    name: Windows x64 package
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Run regression tests
        run: python -B -m unittest discover -s tests -v

      - name: Download and verify the detected Floorp version
        env:
          FLOORP_INSTALLER_URL: ${{ needs.check.outputs.installer_url }}
          FLOORP_INSTALLER_SHA256: ${{ needs.check.outputs.installer_sha256 }}
        run: python scripts/floorp_release.py prepare

      - name: Build portable package
        shell: cmd
        run: call .\Build.bat --local

      - name: Verify packaged archive
        shell: cmd
        run: .\7za64.exe t .\floorpy.exe

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath floorpy.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  floorpy.exe" | Set-Content -LiteralPath floorpy.exe.sha256 -Encoding ascii

      - name: Upload portable browser
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floorpy-windows-x64
          path: |
            floorpy.exe
            floorpy.exe.sha256
            readme.md
            LICENSE.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish Floorpy release
    needs: [check, build]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: floorpy-windows-x64
          path: release

      - name: Publish executable and checksum
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.check.outputs.release_tag }}
          name: Floorpy - Floorp ${{ needs.check.outputs.floorp_tag }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: |
            release/floorpy.exe
            release/floorpy.exe.sha256
            release/readme.md
            release/LICENSE.md
          body: |
            Portable Windows x64 Floorpy package built from Floorp ${{ needs.check.outputs.floorp_tag }}.

            Download `floorpy.exe` and run it. Leave the launcher console open until you close the browser so temporary files can be cleaned up.

            - Upstream release: https://github.com/Floorp-Projects/Floorp/releases/tag/${{ needs.check.outputs.floorp_tag }}
            - Installer SHA-256: `${{ needs.check.outputs.installer_sha256 }}`
            - Floorpy source commit: `${{ github.sha }}`
            - `floorpy.exe.sha256` contains the checksum of the packaged executable.
